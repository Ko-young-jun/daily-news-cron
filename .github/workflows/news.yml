name: Daily News Curation

on:
  schedule:
      - cron: '0 7 * * *'  # 매일 오전 7시 (KST)
          - cron: '0 12 * * *' # 매일 오후 12시 (KST)
              - cron: '0 17 * * *' # 매일 오후 5시 (KST)

              jobs:
                run-news-curation:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Run news curation
                                      run: echo "Daily news curation triggered at $(date)"
